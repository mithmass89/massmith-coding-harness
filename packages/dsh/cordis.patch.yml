# Massmith bundle patch for DeepSeek Harness (Cordis)
# Mounted as a layer after dsh-base. Replace or insert rows here.
# See: https://deepseek-harness.github.io/deepseek-harness/en/reference/

---
- id: massmith
  plugin: ./src/index.ts
  config:
    strict: true
    verbose: false
- id: massmith-diff-check
  plugin: ./src/index.ts
  config:
    strict: true
