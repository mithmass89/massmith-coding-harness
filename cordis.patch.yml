# Massmith-only patch (profile `web`). For the combined massmith + dsh-superagent
# profile, use cordis.combined.patch.yml with profile `superagent` instead.
# NOTE: loader patches address entries by `id`; new entries must use `insert:`.
- insert:
  - id: massmith
    name: massmith-dsh
    config:
      strict: true
      verbose: false
      maxDiffLines: 400
